apply plugin: "io.gitlab.arturbosch.detekt"

detekt {
    config = files("$rootDir/config/detekt/detekt.yml")
    ignoredBuildTypes = ["release"]
    ignoredFlavors = ["mock"]
    parallel = true
    dependencies {
        detektPlugins("io.gitlab.arturbosch.detekt:detekt-formatting:1.23.8")
    }
}

tasks.register('detektTask') {
    description = "Runs detekt analysis on the main and test source sets"
    // TODO: Upgrade to detekt 2.x stable when released (2.0.0-alpha.3 has AGP 9 support but formatting plugin isn't published yet)
    dependsOn 'detekt'
}