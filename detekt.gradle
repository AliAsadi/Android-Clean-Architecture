apply plugin: "dev.detekt"

def libs = rootProject.extensions.getByType(VersionCatalogsExtension).named("libs")

detekt {
    config.setFrom(files("$rootDir/config/detekt/detekt.yml"))
    ignoredBuildTypes = ["release"]
    ignoredFlavors = ["mock"]
    parallel = true
}

dependencies {
    detektPlugins(libs.findLibrary("detekt-rules-ktlint-wrapper").get())
}

// Detekt 2 runs rules that need type resolution only in the variant tasks, so `detekt` (and `check`) delegate to them.
tasks.named("detekt") {
    setSource(files())
    dependsOn("detektMain", "detektTest")
}

tasks.register('detektTask') {
    description = "Runs detekt analysis on the main and test source sets"
    // TODO: Move to a stable detekt 2.x release once one is published.
    dependsOn 'detektMain', 'detektTest'
}
